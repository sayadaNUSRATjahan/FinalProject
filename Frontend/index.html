<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Journal - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="icon" type="image/png" href="resources/journal.png">
</head>

<body>
    <!-- Soft Glow Background -->
    <div class="glow-bg"></div>

    <!-- Floating Glass Bubbles Container -->
    <div class="bubbles-container">
        <div class="bubble b1"></div>
        <div class="bubble b2"></div>
        <div class="bubble b3"></div>
        <div class="bubble b4"></div>
        <div class="bubble b5"></div>
        <div class="bubble b6"></div>
        <div class="bubble b7"></div>
        <div class="bubble b8"></div>
        <div class="bubble b9"></div>
        <div class="bubble b10"></div>
    </div>

    <!-- =========================
         MAIN SECTION
    ========================== -->

    <main class="main-section">

        <!-- HEADER CONTAINER -->
        <div class="header-container">

            <div class="logo-wrapper">
                <div class="logo-circle">
                    <i class="fa-solid fa-book-open main-book-icon"></i>
                    <i class="fa-solid fa-pen-nib pen-nib-icon"></i>
                </div>
            </div>

            <div class="title-wrapper">
                <h2>My Journal</h2>
                <div class="subtitle">
                    Capture Your Thoughts, Preserve Your Memories
                </div>
            </div>

        </div>

        <!-- FORM CONTAINER -->
        <div class="form-container">

            <!-- 🟢 Registration Success Banner (এখানে যুক্ত করা হয়েছে) -->
            <div id="success-banner" style="display: none; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; padding: 12px 15px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; text-align: left; display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 18px;">✅</span>
                <div>
                    <strong>Account created successfully.</strong><br>
                    Please log in to continue.
                </div>
            </div>

            <div id="user-login-error" class="error hidden"></div>

            <form id="login-form" onsubmit="event.preventDefault();">

                <!-- EMAIL -->
                <div class="input-field-container">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <!-- name এবং autocomplete যোগ করা হয়েছে -->
                        <input type="email" id="email" name="email" autocomplete="email" placeholder="Enter your email">
                    </div>
                </div>

                <!-- PASSWORD -->
                <div class="input-field-container">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <!-- name এবং autocomplete যোগ করা হয়েছে -->
                        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password">
                        <i class="fa-regular fa-eye toggle-password" id="toggle-password"
                            onclick="togglePassword()"></i>
                    </div>
                </div>

                <!-- REMEMBER ME -->
                <div class="remember-container">
                    <label class="remember-wrapper">
                        <!-- name যোগ করা হয়েছে -->
                        <input type="checkbox" id="remember-me" name="remember">
                        <span>Remember Me</span>
                    </label>
                </div>

                <!-- LOGIN BUTTON -->
                <div class="action-container">
                    <button type="button" class="login-btn" onclick="handleLogin()">Login</button>
                </div>

            </form>

            <div class="divider-container">
                <div class="divider-line"></div>
                <span>OR</span>
                <div class="divider-line"></div>
            </div>

            <div class="register-container">
                <div class="register-wrapper">
                    Don't have an account?
                    <a href="register.html">Register</a>
                </div>
            </div>

        </div>

    </main>

    <script src="js/login.js"></script>

</body>

</html>
