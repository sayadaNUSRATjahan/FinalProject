<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyJournal</title>

    <link rel="stylesheet" href="css/journal.css">

</head>


<body>

    <section class="main-section">

        <div class="box">


            <!-- =========================
                 HEADER
            ========================== -->

            <div class="header">


                <!-- Top Row -->

                <div class="header-top">


                    <!-- Logo -->

                    <h2>
                        MyJournal
                    </h2>


                    <!-- Header Buttons -->

                    <div class="header-btns">


                        <button id="logout-btn">
                            Logout
                        </button>


                        <button id="show-btn">
                            + New Entry
                        </button>


                    </div>


                </div>


                <!-- Welcome Section -->

                <div class="welcome-section">


                    <h3>
                        Welcome back, Nusrat 🌼
                    </h3>


                    <p>
                        How was your day?
                    </p>


                </div>


            </div>



            <!-- =========================
                 NEW JOURNAL FORM
            ========================== -->

            <div
                id="my-form"
                class="form-box hidden"
            >


                <!-- Form Header -->

                <div class="form-title-row">


                    <h3 id="form-heading">
                        📝 New Journal Entry
                    </h3>


                    <span id="close-form">
                        &times;
                    </span>


                </div>



                <!-- Title -->

                <label for="title">
                    Title
                </label>


                <input
                    type="text"
                    id="title"
                    placeholder="Give your day a title..."
                >



                <!-- Content -->

                <label for="content">
                    Content
                </label>


                <textarea
                    id="content"
                    placeholder="Write about your day, your thoughts, or anything you want to remember..."
                ></textarea>



                <!-- Mood -->

                <label for="mood">
                    How are you feeling?
                </label>


                <select id="mood">


                    <option value="😊 Grateful">
                        😊 Grateful
                    </option>


                    <option value="🚀 Excited">
                        🚀 Excited
                    </option>


                    <option value="💡 Inspired">
                        💡 Inspired
                    </option>


                    <option value="😌 Peaceful">
                        😌 Peaceful
                    </option>


                    <option value="😴 Tired">
                        😴 Tired
                    </option>


                    <option value="😔 Sad">
                        😔 Sad
                    </option>


                </select>



                <!-- Form Buttons -->

                <div class="btn-group">


                    <button
                        type="button"
                        id="cancel-btn"
                    >
                        Cancel
                    </button>


                    <button
                        type="button"
                        id="save-btn"
                    >
                        Save Entry
                    </button>


                </div>


            </div>



            <!-- =========================
                 ALL JOURNALS
            ========================== -->

            <section class="all-journals">


                <div id="post-container"></div>


            </section>


        </div>

    </section>



    <!-- =========================
         UTILITY FUNCTION
    ========================== -->

    <script src="utils/CalculateTimeDifference.js"></script>


    <!-- =========================
         MAIN JAVASCRIPT
    ========================== -->

    <script src="js/journal.js"></script>


</body>

</html>
